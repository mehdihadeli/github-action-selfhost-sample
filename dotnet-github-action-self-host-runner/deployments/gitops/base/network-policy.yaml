apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simple-api
spec:
  podSelector:
    matchLabels:
      app: simple-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress: []