name: Container Image Vulnerability Scan (Trivy)
description: Enforce Trivy, Grype, and optional Snyk gates against the loaded candidate image and generate CycloneDX evidence.
inputs:
  image-ref:
    description: Local Docker image reference loaded from the verified candidate archive.
    required: true
  severity:
    default: HIGH,CRITICAL
  exit-code:
    default: '1'
  trivyignores:
    default: ''
  enable-grype:
    default: 'true'
  enable-snyk:
    default: 'false'
  snyk-token:
    required: false
  dockerfile:
    default: Dockerfile
  artifact-name:
    description: Optional evidence artifact name; empty preserves sca-image.
    default: ''
  upload-sarif:
    default: 'true'
runs:
  using: composite
  steps:
    - name: Scan container with Trivy and Grype
      id: scan
      uses: ./.catalog/.github/actions/security-scan
      with:
        type: image
        target: ${{ inputs.image-ref }}
        scope: image
        severity: ${{ inputs.severity }}
        exit-code: ${{ inputs.exit-code }}
        trivyignores: ${{ inputs.trivyignores }}
        enable-grype: ${{ inputs.enable-grype }}
        enable-snyk: ${{ inputs.enable-snyk }}
        snyk-token: ${{ inputs.snyk-token }}
        dockerfile: ${{ inputs.dockerfile }}
        artifact-name: ${{ inputs.artifact-name }}
        upload-sarif: ${{ inputs.upload-sarif }}
    - name: Record Container Scan Status
      if: always()
      uses: ./.catalog/.github/actions/record-status
      with:
        title: 🐳 Container Vulnerability Scan
        tool: Trivy, Grype, optional Snyk
        step-results: ${{ toJSON(steps) }}
        operation-steps: scan
        job-status: ${{ job.status }}
        report-only: ${{ inputs.exit-code == '0' }}
        details: |
          - **Image:** ${{ inputs.image-ref }}
          - **Severities Monitored:** ${{ inputs.severity }}
          - **Trivyignore Paths:** ${{ inputs.trivyignores || 'Default discovery' }}
          - **Snyk Enabled:** ${{ inputs.enable-snyk }}; independently enforces HIGH+